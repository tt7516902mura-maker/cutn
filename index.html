<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>対戦カウンター</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F1B14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="対戦カウンター">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon.png" type="image/png">
<style>
  :root{
    --bg: #0F1B14;
    --panel: #17251C;
    --panel-2: #1D2E22;
    --panel-line: #2C4433;
    --gold: #E8B923;
    --gold-dim: #6B5A1F;
    --hit: #3DDC84;
    --hit-bg: #163625;
    --strike: #FF5A4E;
    --strike-bg: #3A1E1A;
    --ball: #6FA8F5;
    --foul: #E8C365;
    --text: #F3F1E7;
    --muted: #7C9081;
    --muted-2: #55684F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
  html,body{margin:0;padding:0; touch-action: manipulation;}
  body{
    background: radial-gradient(ellipse at top, #17281C 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    padding: 16px 14px 44px;
  }
  .wrap{ max-width: 460px; margin: 0 auto; }

  /* Header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px;
  }
  .title-block{ display:flex; flex-direction:column; }
  h1{
    font-size: 18px; letter-spacing: 0.08em; margin:0;
    color: var(--gold); font-weight: 700;
  }
  .title-sub{ font-size: 10.5px; color: var(--muted); letter-spacing: 0.1em; margin-top: 2px; }
  .gear-btn{
    background:var(--panel); border:1px solid var(--panel-line); color: var(--muted);
    width:34px; height:34px; border-radius:9px; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .gear-btn.active{ color: var(--gold); border-color: var(--gold-dim); background: #241D0D; }

  /* Pair tabs */
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--panel-line); background: var(--panel);
    color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .tab.active{ background: var(--gold); color: #1A1400; border-color: var(--gold); }
  .tab.add{ color: var(--gold); border-style: dashed; background: transparent; }

  .empty-note{
    text-align:center; color: var(--muted); font-size: 13px; line-height:1.7;
    padding: 44px 14px; border: 1px dashed var(--panel-line); border-radius: 14px;
  }

  /* Add pair inline form */
  .add-form{ display:none; flex-direction:column; gap:8px; margin-bottom: 12px;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:12px; }
  .add-form.show{ display:flex; }
  .add-form .row{ display:flex; gap:8px; }
  .add-form input{
    flex:1; background: var(--panel-2); border: 1px solid var(--panel-line);
    color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px; min-width:0;
  }
  .add-form input:focus{ outline:none; border-color: var(--gold); }
  .add-form .btns{ display:flex; gap:8px; }
  .add-form button{
    flex:1; border:none; border-radius:8px; padding: 9px 0; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-ok{ background: var(--gold); color:#1A1400; }
  .btn-cancel{ background: var(--panel-2); color: var(--muted); border:1px solid var(--panel-line) !important; }

  /* Settings panel */
  .settings{
    display:none; background: var(--panel); border:1px solid var(--panel-line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .settings.show{ display:block; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding: 7px 0; }
  .settings-row + .settings-row{ border-top: 1px solid var(--panel-line); }
  .settings-label{ font-size: 12.5px; color: var(--muted); }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--panel-line);
    background:#20301F; color:var(--text); font-size:15px; cursor:pointer;
  }
  .stepper .val{ min-width: 24px; text-align:center; font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }
  .del-pair{ background:none; border:none; color:#C97B74; font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  .backup-row{ align-items:center; }
  .backup-btns{ display:flex; gap:8px; }
  .backup-btn{
    background:#20301F; border:1px solid var(--panel-line); color: var(--text);
    font-size:12px; font-weight:700; padding: 7px 12px; border-radius:8px; cursor:pointer;
  }
  .backup-btn.primary{ background: var(--gold); color:#1A1400; border-color: var(--gold); }
  .backup-area{ margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--panel-line); }
  .backup-area textarea{
    width:100%; min-height: 90px; background: var(--panel-2); border:1px solid var(--panel-line);
    color: var(--text); border-radius:8px; padding:8px; font-size:11px; font-family: monospace;
    resize: vertical;
  }
  .backup-hint{ font-size: 10.5px; color: var(--muted); margin-top: 6px; line-height:1.5; }
  .backup-apply-row{ margin-top: 8px; }
  .backup-apply-row .backup-btn{ width:100%; }

  /* Game card */
  .game-card{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--panel-line); border-radius: 16px; padding: 16px; margin-bottom: 12px;
  }
  .game-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
  .game-num{ font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 0.04em; }
  .game-num b{ font-size: 20px; margin-right:2px; font-variant-numeric: tabular-nums; }
  .half-badge{
    display:inline-block; margin-left:6px; font-size:11px; font-weight:800; letter-spacing:0.04em;
    color:#1A1400; background: var(--gold); border-radius:6px; padding:2px 7px; vertical-align:2px;
  }
  .half-badge:empty{ display:none; }
  .roulette-btn{
    background: var(--gold); color:#1A1400; border:none; border-radius: 10px;
    padding: 9px 14px; font-size: 12.5px; font-weight:800; cursor:pointer; letter-spacing:0.02em;
  }
  .roulette-btn:active{ transform: scale(0.96); }
  .roulette-btn:disabled{ opacity: 0.6; }

  .role-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role-card{
    border-radius: 12px; padding: 12px 8px; text-align:center; border: 1px solid var(--panel-line);
    background: var(--panel-2); transition: background .2s, border-color .2s;
  }
  .role-card.pitcher.set{ background: var(--strike-bg); border-color: #6A362E; }
  .role-card.batter.set{ background: var(--hit-bg); border-color: #2A5A3D; }
  .role-tag{ font-size: 10.5px; letter-spacing: 0.14em; font-weight:700; margin-bottom: 6px; }
  .role-card.pitcher .role-tag{ color: var(--strike); }
  .role-card.batter .role-tag{ color: var(--hit); }
  .role-name{ font-size: 16px; font-weight: 800; color: var(--text); min-height: 20px; }
  .role-name.placeholder{ color: var(--muted-2); font-weight: 500; font-size: 13px; }
  .role-name.spinning{ color: var(--muted); }

  .waiting-note{ text-align:center; font-size:12.5px; color: var(--muted); margin-top: 10px; line-height:1.6; }

  /* Progress lamps */
  .progress-card{
    background: var(--panel); border:1px solid var(--panel-line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .progress-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .progress-top .label{ font-size:11.5px; color:var(--muted); letter-spacing:0.06em; }
  .progress-top .count{ font-size: 12.5px; color: var(--gold); font-weight:700; font-variant-numeric: tabular-nums; }
  .lamps{ display:flex; flex-wrap:wrap; gap:5px; }
  .lamp{ width:15px; height:15px; border-radius:50%; background: #223226; border: 1px solid var(--panel-line); }
  .lamp.on{ background: var(--gold); box-shadow: 0 0 7px 1px rgba(232,185,35,0.6); border-color: var(--gold); }
  .lamp.over{ background: var(--strike); box-shadow: 0 0 7px 1px rgba(255,90,78,0.6); border-color: var(--strike); }

  /* Stats panel (right side only) */
  .stats-card{
    background: var(--panel); border:1px solid var(--panel-line); border-radius: 16px;
    padding: 14px 12px; margin-bottom: 12px;
  }
  .stats-title{ text-align:center; font-size:12px; color: var(--muted); letter-spacing:0.1em; margin-bottom: 12px; }
  .stat-cols{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .player-total-row{ padding: 10px 2px; }
  .player-total-row + .player-total-row{ border-top: 1px solid var(--panel-line); }
  .player-total-name{ font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .player-total-nums{ display:grid; grid-template-columns: repeat(2, auto); gap: 6px 20px; justify-content:start; }
  .mini-stat{ display:flex; align-items:center; gap:6px; font-size: 15px; font-weight:800; font-variant-numeric: tabular-nums; }
  .mini-stat.hit{ color: var(--hit); }
  .mini-stat.strike{ color: var(--strike); }
  .mini-stat.ball{ color: var(--ball); }
  .mini-stat.foul{ color: var(--foul); }
  .stat-label{ display:flex; align-items:center; justify-content:center; gap:5px; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; }
  .dot.hit{ background: var(--hit); }
  .dot.strike{ background: var(--strike); }
  .dot.ball{ background: var(--ball); }
  .dot.foul{ background: var(--foul); }
  .stat-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .stat-num{ min-width:44px; text-align:center; font-size: 32px; font-weight:800; font-variant-numeric: tabular-nums;
    font-family: 'Arial Black', 'Hiragino Sans', sans-serif; }
  .stat-num.hit{ color: var(--hit); }
  .stat-num.strike{ color: var(--strike); }
  .stat-num.ball{ color: var(--ball); }
  .stat-num.foul{ color: var(--foul); }
  .cbtn{ width: 34px; height: 34px; border-radius: 10px; border:none; font-size: 17px; font-weight:800;
    cursor:pointer; color:#0C1408; display:flex; align-items:center; justify-content:center; user-select:none; flex-shrink:0; }
  .cbtn:active{ transform: scale(0.92); }
  .cbtn.minus{ background: #2A3B28; color: var(--muted); }
  .cbtn.plus.hit{ background: var(--hit); }
  .cbtn.plus.strike{ background: var(--strike); }
  .cbtn.plus.ball{ background: var(--ball); }
  .cbtn.plus.foul{ background: var(--foul); color:#241C05; }

  /* Action row */
  .action-btn{ border:none; border-radius: 14px; padding: 14px 10px; font-size: 13.5px; font-weight:700; cursor:pointer; }
  .btn-reset{ width:100%; background: var(--panel); color: #C97B74; border: 1px solid #4A2A26; }
  .btn-reset.armed{ background: var(--strike); color: #2A0C09; border-color: var(--strike); }

  .loading{ text-align:center; color:var(--muted); padding:60px 0; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>対戦カウンター</h1>
      <div class="title-sub">PITCHING MATCH TRACKER</div>
    </div>
    <button class="gear-btn" id="gearBtn">⚙</button>
  </header>

  <div id="loading" class="loading">読み込み中…</div>

  <div id="app" style="display:none;">
    <div class="tabs" id="tabs"></div>

    <div class="add-form" id="addForm">
      <div class="row">
        <input type="text" id="name1Input" placeholder="選手A" maxlength="10">
        <input type="text" id="name2Input" placeholder="選手B" maxlength="10">
      </div>
      <div class="btns">
        <button class="btn-ok" id="addOk">組を追加</button>
        <button class="btn-cancel" id="addCancel">キャンセル</button>
      </div>
    </div>

    <div class="settings" id="settingsPanel">
      <div class="settings-row">
        <div class="settings-label">1回の投球数</div>
        <div class="stepper">
          <button id="roundMinus">−</button>
          <div class="val" id="roundVal">15</div>
          <button id="roundPlus">＋</button>
        </div>
      </div>
      <div class="settings-row" id="delRow" style="display:none;">
        <div class="settings-label">選択中の組を削除</div>
        <button class="del-pair" id="delPairBtn">削除する</button>
      </div>
      <div class="settings-row backup-row">
        <div class="settings-label">データのバックアップ</div>
        <div class="backup-btns">
          <button class="backup-btn" id="exportBtn">書き出す</button>
          <button class="backup-btn" id="importBtn">読み込む</button>
        </div>
      </div>
      <div class="backup-area" id="backupArea" style="display:none;">
        <textarea id="backupText" placeholder="ここにバックアップ文字列が表示されます。読み込む際はここに貼り付けてください。"></textarea>
        <div class="backup-hint" id="backupHint">全選択してコピーし、安全な場所に保存してください。</div>
        <div class="backup-apply-row" id="backupApplyRow" style="display:none;">
          <button class="backup-btn primary" id="applyImportBtn">この内容を反映する</button>
        </div>
      </div>
    </div>

    <div id="emptyNote" class="empty-note">
      組がまだありません。<br>上の「＋追加」から2人1組を追加してください。
    </div>

    <div id="mainContent" style="display:none;">
      <div class="game-card">
        <div class="game-top">
          <div class="game-num">第<b id="gameNumVal">0</b>試合<span class="half-badge" id="halfLabel"></span></div>
          <button class="roulette-btn" id="rouletteBtn">🎲 ルーレットで開始</button>
        </div>
        <div class="role-grid">
          <div class="role-card pitcher" id="pitcherCard">
            <div class="role-tag" id="pitcherRoleTag">投手</div>
            <div class="role-name placeholder" id="pitcherName">−</div>
          </div>
          <div class="role-card batter" id="batterCard">
            <div class="role-tag" id="batterRoleTag">バッター</div>
            <div class="role-name placeholder" id="batterName">−</div>
          </div>
        </div>
        <div class="waiting-note" id="waitingNote">最初の1試合だけルーレットで先攻・後攻を決めます。以降は各試合で表→裏の順に自動進行します。</div>
      </div>

      <div class="progress-card">
        <div class="progress-top">
          <div class="label">投球数</div>
          <div class="count" id="progressCount">0 / 15</div>
        </div>
        <div class="lamps" id="lamps"></div>
      </div>

      <div class="stats-card totals-card">
        <div class="stats-title" id="totalsTitle">通算成績</div>
        <div class="player-total-row">
          <div class="player-total-name" id="totalNameA">−</div>
          <div class="player-total-nums">
            <div class="mini-stat hit"><span class="dot hit"></span><span id="totalHitA">0</span></div>
            <div class="mini-stat strike"><span class="dot strike"></span><span id="totalStrikeA">0</span></div>
            <div class="mini-stat ball"><span class="dot ball"></span><span id="totalBallA">0</span></div>
            <div class="mini-stat foul"><span class="dot foul"></span><span id="totalFoulA">0</span></div>
          </div>
        </div>
        <div class="player-total-row">
          <div class="player-total-name" id="totalNameB">−</div>
          <div class="player-total-nums">
            <div class="mini-stat hit"><span class="dot hit"></span><span id="totalHitB">0</span></div>
            <div class="mini-stat strike"><span class="dot strike"></span><span id="totalStrikeB">0</span></div>
            <div class="mini-stat ball"><span class="dot ball"></span><span id="totalBallB">0</span></div>
            <div class="mini-stat foul"><span class="dot foul"></span><span id="totalFoulB">0</span></div>
          </div>
        </div>
      </div>

      <div class="stats-card">
        <div class="stats-title">今試合の成績</div>
        <div class="stat-cols">
          <div>
            <div class="stat-label"><span class="dot hit"></span>ヒット数</div>
            <div class="stat-row">
              <button class="cbtn minus" data-act="hit-minus">−</button>
              <div class="stat-num hit" id="hitVal">0</div>
              <button class="cbtn plus hit" data-act="hit-plus">＋</button>
            </div>
          </div>
          <div>
            <div class="stat-label"><span class="dot strike"></span>ストライク</div>
            <div class="stat-row">
              <button class="cbtn minus" data-act="strike-minus">−</button>
              <div class="stat-num strike" id="strikeVal">0</div>
              <button class="cbtn plus strike" data-act="strike-plus">＋</button>
            </div>
          </div>
          <div>
            <div class="stat-label"><span class="dot ball"></span>ボール</div>
            <div class="stat-row">
              <button class="cbtn minus" data-act="pass-minus">−</button>
              <div class="stat-num ball" id="passVal">0</div>
              <button class="cbtn plus ball" data-act="pass-plus">＋</button>
            </div>
          </div>
          <div>
            <div class="stat-label"><span class="dot foul"></span>ファウル</div>
            <div class="stat-row">
              <button class="cbtn minus" data-act="foul-minus">−</button>
              <div class="stat-num foul" id="foulVal">0</div>
              <button class="cbtn plus foul" data-act="foul-plus">＋</button>
            </div>
          </div>
        </div>
      </div>

      <button class="action-btn btn-reset" id="resetBtn">リセット</button>
    </div>
  </div>
</div>

<script>
(function(){
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 350){ e.preventDefault(); }
    lastTouchEnd = now;
  }, { passive: false });

  const els = {
    loading: document.getElementById('loading'),
    app: document.getElementById('app'),
    tabs: document.getElementById('tabs'),
    addForm: document.getElementById('addForm'),
    name1Input: document.getElementById('name1Input'),
    name2Input: document.getElementById('name2Input'),
    addOk: document.getElementById('addOk'),
    addCancel: document.getElementById('addCancel'),
    gearBtn: document.getElementById('gearBtn'),
    settingsPanel: document.getElementById('settingsPanel'),
    roundVal: document.getElementById('roundVal'),
    roundMinus: document.getElementById('roundMinus'),
    roundPlus: document.getElementById('roundPlus'),
    delRow: document.getElementById('delRow'),
    delPairBtn: document.getElementById('delPairBtn'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    applyImportBtn: document.getElementById('applyImportBtn'),
    backupArea: document.getElementById('backupArea'),
    backupText: document.getElementById('backupText'),
    backupHint: document.getElementById('backupHint'),
    backupApplyRow: document.getElementById('backupApplyRow'),
    emptyNote: document.getElementById('emptyNote'),
    mainContent: document.getElementById('mainContent'),
    gameNumVal: document.getElementById('gameNumVal'),
    halfLabel: document.getElementById('halfLabel'),
    rouletteBtn: document.getElementById('rouletteBtn'),
    pitcherCard: document.getElementById('pitcherCard'),
    batterCard: document.getElementById('batterCard'),
    pitcherRoleTag: document.getElementById('pitcherRoleTag'),
    batterRoleTag: document.getElementById('batterRoleTag'),
    pitcherName: document.getElementById('pitcherName'),
    batterName: document.getElementById('batterName'),
    waitingNote: document.getElementById('waitingNote'),
    progressCount: document.getElementById('progressCount'),
    lamps: document.getElementById('lamps'),
    hitVal: document.getElementById('hitVal'),
    strikeVal: document.getElementById('strikeVal'),
    passVal: document.getElementById('passVal'),
    foulVal: document.getElementById('foulVal'),
    totalsTitle: document.getElementById('totalsTitle'),
    totalNameA: document.getElementById('totalNameA'),
    totalNameB: document.getElementById('totalNameB'),
    totalHitA: document.getElementById('totalHitA'),
    totalStrikeA: document.getElementById('totalStrikeA'),
    totalBallA: document.getElementById('totalBallA'),
    totalFoulA: document.getElementById('totalFoulA'),
    totalHitB: document.getElementById('totalHitB'),
    totalStrikeB: document.getElementById('totalStrikeB'),
    totalBallB: document.getElementById('totalBallB'),
    totalFoulB: document.getElementById('totalFoulB'),
    resetBtn: document.getElementById('resetBtn'),
  };

  let state = {
    pairs: [],        // [{id, name1, name2}]
    currentId: null,
    perRound: 15,
    pstate: {}         // id -> {gameNumber, batter: 'A'|'B'|null, stats:{hit,strike,pass}, totals:{A:{},B:{}}}
  };

  function blankPState(){ return { gameNumber: 0, half: null, leadBatter: null, batter: null, stats: { hit:0, strike:0, pass:0, foul:0 }, totals: { A:{hit:0,strike:0,pass:0,foul:0}, B:{hit:0,strike:0,pass:0,foul:0} } }; }
  function uid(){ return 'p' + Date.now() + Math.floor(Math.random()*1000); }

  async function save(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('save failed', key, e); }
  }
  async function load(key){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function removeKey(key){
    try{ await window.storage.delete(key, false); }catch(e){}
  }

  async function persistPairs(){
    await save('pairs', state.pairs);
    await save('currentId', state.currentId);
    await save('perRound', state.perRound);
  }
  async function persistPState(id){
    await save('pstate:' + id, state.pstate[id]);
  }

  async function init(){
    const pairs = await load('pairs');
    const currentId = await load('currentId');
    const perRound = await load('perRound');
    if(pairs) state.pairs = pairs;
    if(currentId) state.currentId = currentId;
    if(perRound) state.perRound = perRound;

    for(const p of state.pairs){
      const s = await load('pstate:' + p.id);
      state.pstate[p.id] = s || blankPState();
      const ps0 = state.pstate[p.id];
      if(ps0.stats.foul === undefined) ps0.stats.foul = 0;
      const t = ps0.totals;
      if(!t || !t.A || !t.B) ps0.totals = { A:{hit:0,strike:0,pass:0,foul:0}, B:{hit:0,strike:0,pass:0,foul:0} };
      else { if(t.A.foul === undefined) t.A.foul = 0; if(t.B.foul === undefined) t.B.foul = 0; }
      if(ps0.half === undefined){
        if(ps0.batter){ ps0.leadBatter = ps0.batter; ps0.half = 'top'; }
        else { ps0.leadBatter = null; ps0.half = null; ps0.batter = null; }
      }
    }
    if(!state.currentId && state.pairs.length){
      state.currentId = state.pairs[0].id;
    }
    els.loading.style.display = 'none';
    els.app.style.display = 'block';
    render();
  }

  function currentPair(){ return state.pairs.find(p => p.id === state.currentId) || null; }
  function currentPState(){
    if(!state.currentId) return null;
    if(!state.pstate[state.currentId]) state.pstate[state.currentId] = blankPState();
    return state.pstate[state.currentId];
  }

  function render(){
    // tabs
    els.tabs.innerHTML = '';
    state.pairs.forEach(p => {
      const b = document.createElement('button');
      b.className = 'tab' + (p.id === state.currentId ? ' active' : '');
      b.textContent = p.name1 + ' & ' + p.name2;
      b.onclick = () => { state.currentId = p.id; save('currentId', p.id); resetArm(); render(); };
      els.tabs.appendChild(b);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'tab add';
    addBtn.textContent = '＋ 追加';
    addBtn.onclick = () => {
      els.addForm.classList.add('show');
      els.name1Input.value = ''; els.name2Input.value = '';
      els.name1Input.focus();
    };
    els.tabs.appendChild(addBtn);

    // settings
    els.roundVal.textContent = state.perRound;
    els.delRow.style.display = state.currentId ? 'flex' : 'none';

    const hasPairs = state.pairs.length > 0;
    els.emptyNote.style.display = hasPairs ? 'none' : 'block';
    els.mainContent.style.display = hasPairs ? 'block' : 'none';
    if(!hasPairs) return;

    const pair = currentPair();
    const ps = currentPState();

    els.gameNumVal.textContent = ps.gameNumber;
    els.halfLabel.textContent = ps.half === 'top' ? '表' : (ps.half === 'bottom' ? '裏' : '');

    if(ps.leadBatter === null){
      els.rouletteBtn.textContent = '🎲 ルーレットで先攻・後攻を決める';
    } else if(ps.half === 'top'){
      els.rouletteBtn.textContent = '▶ 裏へ進む';
    } else {
      els.rouletteBtn.textContent = '▶ 次の試合へ（表）';
    }

    if(ps.batter){
      const batterName = ps.batter === 'A' ? pair.name1 : pair.name2;
      const pitcherName = ps.batter === 'A' ? pair.name2 : pair.name1;
      els.batterName.textContent = batterName;
      els.pitcherName.textContent = pitcherName;
      els.batterName.classList.remove('placeholder');
      els.pitcherName.classList.remove('placeholder');
      els.batterCard.classList.add('set');
      els.pitcherCard.classList.add('set');
      els.waitingNote.style.display = 'none';
      const battingSideLabel = ps.half === 'top' ? '先攻' : '後攻';
      const pitchingSideLabel = ps.half === 'top' ? '後攻' : '先攻';
      els.batterRoleTag.textContent = 'バッター ・ ' + battingSideLabel;
      els.pitcherRoleTag.textContent = '投手 ・ ' + pitchingSideLabel;
    } else {
      els.batterName.textContent = '−';
      els.pitcherName.textContent = '−';
      els.batterName.classList.add('placeholder');
      els.pitcherName.classList.add('placeholder');
      els.batterCard.classList.remove('set');
      els.pitcherCard.classList.remove('set');
      els.waitingNote.style.display = 'block';
      els.batterRoleTag.textContent = 'バッター';
      els.pitcherRoleTag.textContent = '投手';
    }

    els.hitVal.textContent = ps.stats.hit;
    els.strikeVal.textContent = ps.stats.strike;
    els.passVal.textContent = ps.stats.pass;
    els.foulVal.textContent = ps.stats.foul;

    els.totalsTitle.textContent = '通算成績（全' + ps.gameNumber + '試合）';
    els.totalNameA.textContent = pair.name1;
    els.totalNameB.textContent = pair.name2;
    const liveA = {
      hit: ps.totals.A.hit + (ps.batter === 'A' ? ps.stats.hit : 0),
      strike: ps.totals.A.strike + (ps.batter === 'A' ? ps.stats.strike : 0),
      pass: ps.totals.A.pass + (ps.batter === 'A' ? ps.stats.pass : 0),
      foul: ps.totals.A.foul + (ps.batter === 'A' ? ps.stats.foul : 0)
    };
    const liveB = {
      hit: ps.totals.B.hit + (ps.batter === 'B' ? ps.stats.hit : 0),
      strike: ps.totals.B.strike + (ps.batter === 'B' ? ps.stats.strike : 0),
      pass: ps.totals.B.pass + (ps.batter === 'B' ? ps.stats.pass : 0),
      foul: ps.totals.B.foul + (ps.batter === 'B' ? ps.stats.foul : 0)
    };
    els.totalHitA.textContent = liveA.hit;
    els.totalStrikeA.textContent = liveA.strike;
    els.totalBallA.textContent = liveA.pass;
    els.totalFoulA.textContent = liveA.foul;
    els.totalHitB.textContent = liveB.hit;
    els.totalStrikeB.textContent = liveB.strike;
    els.totalBallB.textContent = liveB.pass;
    els.totalFoulB.textContent = liveB.foul;

    const total = ps.stats.hit + ps.stats.strike + ps.stats.foul;
    els.progressCount.textContent = total + ' / ' + state.perRound;

    els.lamps.innerHTML = '';
    const lampTotal = Math.max(state.perRound, total);
    for(let i=0;i<lampTotal;i++){
      const d = document.createElement('div');
      d.className = 'lamp';
      if(i < total) d.classList.add(i < state.perRound ? 'on' : 'over');
      els.lamps.appendChild(d);
    }
  }

  function resetArm(){
    els.resetBtn.classList.remove('armed');
    els.resetBtn.textContent = 'リセット';
    clearTimeout(resetArmTimer);
  }

  // --- add pair ---
  els.addOk.onclick = async () => {
    const n1 = els.name1Input.value.trim();
    const n2 = els.name2Input.value.trim();
    if(!n1 || !n2) return;
    const id = uid();
    state.pairs.push({id, name1: n1, name2: n2});
    state.pstate[id] = blankPState();
    state.currentId = id;
    els.addForm.classList.remove('show');
    await persistPairs();
    await persistPState(id);
    render();
  };
  els.addCancel.onclick = () => { els.addForm.classList.remove('show'); };
  els.name2Input.addEventListener('keydown', (e) => { if(e.key === 'Enter') els.addOk.click(); });

  // --- delete pair ---
  els.delPairBtn.onclick = async () => {
    if(!state.currentId) return;
    if(els.delPairBtn.textContent === '削除する'){
      els.delPairBtn.textContent = '本当に削除？';
      setTimeout(() => { if(els.delPairBtn.textContent === '本当に削除？') els.delPairBtn.textContent = '削除する'; }, 3000);
      return;
    }
    const id = state.currentId;
    state.pairs = state.pairs.filter(p => p.id !== id);
    delete state.pstate[id];
    try{ await window.storage.delete('pstate:' + id, false); }catch(e){}
    state.currentId = state.pairs.length ? state.pairs[0].id : null;
    els.delPairBtn.textContent = '削除する';
    await persistPairs();
    render();
  };

  // --- settings ---
  els.gearBtn.onclick = () => {
    els.settingsPanel.classList.toggle('show');
    els.gearBtn.classList.toggle('active');
  };

  // --- backup: export ---
  els.exportBtn.onclick = () => {
    const payload = {
      v: 1,
      pairs: state.pairs,
      currentId: state.currentId,
      perRound: state.perRound,
      pstate: state.pstate
    };
    els.backupText.value = JSON.stringify(payload);
    els.backupHint.textContent = '全選択してコピーし、安全な場所（メモアプリなど）に保存してください。';
    els.backupApplyRow.style.display = 'none';
    els.backupArea.style.display = 'block';
    els.backupText.focus();
    els.backupText.select();
  };

  // --- backup: import (show paste area) ---
  els.importBtn.onclick = () => {
    els.backupText.value = '';
    els.backupHint.textContent = 'バックアップ文字列を貼り付けて「この内容を反映する」を押してください。';
    els.backupApplyRow.style.display = 'block';
    els.backupArea.style.display = 'block';
    els.backupText.focus();
  };

  // --- backup: apply pasted data ---
  els.applyImportBtn.onclick = async () => {
    let data;
    try{ data = JSON.parse(els.backupText.value); }
    catch(e){ els.backupHint.textContent = '読み込めませんでした。文字列が正しいか確認してください。'; return; }
    if(!data || !Array.isArray(data.pairs) || typeof data.pstate !== 'object'){
      els.backupHint.textContent = '形式が正しくないデータです。';
      return;
    }
    state.pairs = data.pairs;
    state.currentId = data.currentId || (data.pairs[0] ? data.pairs[0].id : null);
    state.perRound = data.perRound || 15;
    state.pstate = data.pstate;
    for(const p of state.pairs){
      if(!state.pstate[p.id]) state.pstate[p.id] = blankPState();
      const ps0 = state.pstate[p.id];
      if(ps0.stats.foul === undefined) ps0.stats.foul = 0;
      if(!ps0.totals || !ps0.totals.A || !ps0.totals.B) ps0.totals = { A:{hit:0,strike:0,pass:0,foul:0}, B:{hit:0,strike:0,pass:0,foul:0} };
      if(ps0.half === undefined){
        if(ps0.batter){ ps0.leadBatter = ps0.batter; ps0.half = 'top'; }
        else { ps0.leadBatter = null; ps0.half = null; ps0.batter = null; }
      }
    }
    await persistPairs();
    for(const p of state.pairs){ await persistPState(p.id); }
    els.backupHint.textContent = '復元しました。';
    els.backupApplyRow.style.display = 'none';
    render();
  };

  els.roundMinus.onclick = async () => {
    state.perRound = Math.max(1, state.perRound - 1);
    await save('perRound', state.perRound);
    render();
  };
  els.roundPlus.onclick = async () => {
    state.perRound = Math.min(200, state.perRound + 1);
    await save('perRound', state.perRound);
    render();
  };

  // --- stat buttons ---
  document.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!state.currentId) return;
      const [kind, dir] = btn.dataset.act.split('-');
      const ps = currentPState();
      const delta = dir === 'plus' ? 1 : -1;
      ps.stats[kind] = Math.max(0, ps.stats[kind] + delta);
      await persistPState(state.currentId);
      render();
    });
  });

  // --- reset button ---
  let resetArmTimer = null;
  els.resetBtn.onclick = async () => {
    if(!state.currentId) return;
    if(!els.resetBtn.classList.contains('armed')){
      els.resetBtn.classList.add('armed');
      els.resetBtn.textContent = 'もう一度押して確定';
      resetArmTimer = setTimeout(resetArm, 3000);
      return;
    }
    const ps = currentPState();
    ps.stats = { hit:0, strike:0, pass:0, foul:0 };
    await persistPState(state.currentId);
    resetArm();
    render();
  };

  // --- game advance: roulette decides 先攻/後攻 once; each game then plays 表 (先攻 bats) then 裏 (後攻 bats) ---
  function finalizeHalf(ps){
    if(ps.batter){
      const b = ps.batter;
      ps.totals[b].hit += ps.stats.hit;
      ps.totals[b].strike += ps.stats.strike;
      ps.totals[b].pass += ps.stats.pass;
      ps.totals[b].foul += ps.stats.foul;
    }
    ps.stats = { hit:0, strike:0, pass:0, foul:0 };
  }

  els.rouletteBtn.onclick = async () => {
    if(!state.currentId) return;
    const pair = currentPair();
    const ps = currentPState();

    if(ps.leadBatter === null){
      // decided once: who bats first (先攻) for every game's 表
      els.rouletteBtn.disabled = true;
      els.waitingNote.style.display = 'none';
      els.batterCard.classList.remove('set');
      els.pitcherCard.classList.remove('set');

      const finalLead = Math.random() < 0.5 ? 'A' : 'B';
      const steps = 14;
      let i = 0;
      let delay = 60;

      function spinStep(){
        const guess = Math.random() < 0.5 ? 'A' : 'B';
        els.batterName.textContent = guess === 'A' ? pair.name1 : pair.name2;
        els.pitcherName.textContent = guess === 'A' ? pair.name2 : pair.name1;
        els.batterName.classList.add('spinning');
        els.pitcherName.classList.add('spinning');
        i++;
        if(i < steps){
          delay += 18;
          setTimeout(spinStep, delay);
        } else {
          els.batterName.classList.remove('spinning');
          els.pitcherName.classList.remove('spinning');
          ps.leadBatter = finalLead;
          ps.gameNumber = 1;
          ps.half = 'top';
          ps.batter = finalLead;
          ps.stats = { hit:0, strike:0, pass:0, foul:0 };
          persistPState(state.currentId).then(() => {
            els.rouletteBtn.disabled = false;
            render();
          });
        }
      }
      spinStep();
    } else if(ps.half === 'top'){
      // move from 表 to 裏 within the same game
      finalizeHalf(ps);
      ps.half = 'bottom';
      ps.batter = ps.leadBatter === 'A' ? 'B' : 'A';
      await persistPState(state.currentId);
      render();
    } else {
      // move from 裏 to the next game's 表
      finalizeHalf(ps);
      ps.gameNumber += 1;
      ps.half = 'top';
      ps.batter = ps.leadBatter;
      await persistPState(state.currentId);
      render();
    }
  };

  init();
})();

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

</script>
</body>
</html>
